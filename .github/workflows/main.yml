name: Build AetherPS4 iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct full AetherPS4 source
        shell: bash
        run: |
          set -euxo pipefail
          cat AetherPS4-source.zip.part-* > "$RUNNER_TEMP/AetherPS4-source.zip"
          mkdir -p extracted/source
          unzip -q "$RUNNER_TEMP/AetherPS4-source.zip" -d extracted/source
          find extracted/source -name '*.xcodeproj' -o -name '*.xcworkspace'
          find extracted/source -type f \( -name 'EmulatorProcess.swift' -o -name 'shadps4_ios_api.cpp' -o -name 'shadps4_ios_api.h' \) -print

      - name: Select full iOS project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=$(find extracted/source -name 'AetherPS4-iOS.xcodeproj' -print -quit)
          test -n "$PROJECT" || { echo 'ERROR: AetherPS4-iOS.xcodeproj not found'; exit 1; }
          SCHEME=$(xcodebuild -project "$PROJECT" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["project"]["schemes"][0])')
          SOURCE_ROOT="$GITHUB_WORKSPACE/extracted/source"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "SOURCE_ROOT=$SOURCE_ROOT" >> "$GITHUB_ENV"

      - name: Build full iOS application
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            HEADER_SEARCH_PATHS="$(inherited) $SOURCE_ROOT/src/platform/ios $SOURCE_ROOT/src/core/pkg_extract $SOURCE_ROOT/src/core/sysmodules_import $SOURCE_ROOT/src/core/user_profile_bridge" \
            FRAMEWORK_SEARCH_PATHS="$(inherited) $SOURCE_ROOT/AetherPS4-iOS/Frameworks" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Validate generated application
        shell: bash
        run: |
          set -euxo pipefail
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          EXENAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          EXE="$APP/$EXENAME"
          ls -lh "$EXE"
          file "$EXE"
          echo '=== shadPS4 symbols ==='
          nm "$EXE" 2>/dev/null | grep -E 'shadps4_(init|run|prepare_window)' | head -20 || true
          SIZE=$(stat -f%z "$EXE")
          if [ "$SIZE" -lt 500000 ]; then
            echo "ERROR: executable is only $SIZE bytes; emulator core is not linked."
            exit 1
          fi
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qr AetherPS4-with-emulator-unsigned.ipa Payload
          ls -lh AetherPS4-with-emulator-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AetherPS4-with-emulator
          path: ${{ runner.temp }}/AetherPS4-with-emulator-unsigned.ipa
          if-no-files-found: error
