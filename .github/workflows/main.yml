name: Build MaxPS4 iOS

on:
  workflow_dispatch:
  push:
    branches: [ main, maxps4-redesign ]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout MaxPS4
        uses: actions/checkout@v4

      - name: Prepare build tools
        shell: bash
        run: |
          set -euxo pipefail
          brew install ninja protobuf || true
          PROTOC="$(brew --prefix protobuf)/bin/protoc"
          test -x "$PROTOC"
          echo "NATIVE_PROTOC=$PROTOC" >> "$GITHUB_ENV"
          echo "$(dirname "$PROTOC")" >> "$GITHUB_PATH"

      - name: Restore and patch AetherPS4 iOS source tree
        shell: bash
        run: |
          set -euxo pipefail
          ENGINE_ROOT="$RUNNER_TEMP/aetherps4-ios-engine"
          git clone https://github.com/Leviidev/AetherPS4.git "$ENGINE_ROOT"
          git -C "$ENGINE_ROOT" checkout 74f94b61b213fbc231b59a3917cb404cbb25e098
          git -C "$ENGINE_ROOT" submodule update --init --recursive
          test -f "$ENGINE_ROOT/src/platform/ios/shadps4_ios_api.cpp"
          test -d "$ENGINE_ROOT/AetherPS4-iOS"
          grep -q 'ENABLE_SHADPS4_IOS_LIB' "$ENGINE_ROOT/CMakeLists.txt"
          grep -q 'add_library(shadps4_ios STATIC' "$ENGINE_ROOT/CMakeLists.txt"

          # MaxPS4 UI/branding overlay. Keep upstream emulator implementation intact.
          cp "$GITHUB_WORKSPACE/patches/MaxPS4ContentView.swift" "$ENGINE_ROOT/AetherPS4-iOS/Sources/Views/ContentView.swift"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName MaxPS4" "$ENGINE_ROOT/AetherPS4-iOS/Info.plist" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string MaxPS4" "$ENGINE_ROOT/AetherPS4-iOS/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName MaxPS4" "$ENGINE_ROOT/AetherPS4-iOS/Info.plist" || /usr/libexec/PlistBuddy -c "Add :CFBundleName string MaxPS4" "$ENGINE_ROOT/AetherPS4-iOS/Info.plist"

          python3 - "$ENGINE_ROOT/externals/epoll-shim/src/CMakeLists.txt" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]); s=p.read_text(); start=s.index('include(CheckCSourceRuns)'); a=s.index('check_c_source_runs(',start); needle='ALLOWS_ONESHOT_TIMERS_WITH_TIMEOUT_ZERO)'; b=s.index(needle,a)+len(needle); probe=s[a:b]
          p.write_text(s[:a]+'if(CMAKE_SYSTEM_NAME STREQUAL "iOS")\n  set(ALLOWS_ONESHOT_TIMERS_WITH_TIMEOUT_ZERO FALSE CACHE BOOL "iOS cross-compile result" FORCE)\nelse()\n'+probe+'\nendif()'+s[b:])
          PY

          python3 - "$ENGINE_ROOT" <<'PY'
          import sys
          from pathlib import Path
          root=Path(sys.argv[1]); patched=0
          for p in root.rglob('ImGuiFileDialog.cpp'):
              s=p.read_text(errors='ignore')
              if 'std::system(' not in s: continue
              s=s.replace('std::system(', 'MaxPS4IOSSystemUnavailable(')
              if 'static int MaxPS4IOSSystemUnavailable' not in s: s='\nstatic int MaxPS4IOSSystemUnavailable(const char*) { return -1; }\n'+s
              p.write_text(s); patched+=1
          if not patched: raise SystemExit('ImGuiFileDialog.cpp std::system call not found')
          PY

          python3 - "$ENGINE_ROOT/src/core/signals.cpp" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]); s=p.read_text(); inc='#include "core/ios/ios_jit_allocator.h"'; guarded='#ifdef SHADPS4_ENABLE_FEX_GUEST_CPU\n#include "common/singleton.h"'
          if guarded not in s: raise SystemExit('signals.cpp include layout changed; review required')
          if not s.startswith(inc+'\n'): s=inc+'\n'+s
          p.write_text(s)
          PY

          python3 - "$ENGINE_ROOT/generate_project.rb" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]); s=p.read_text(); old="project.new_target(:application, project_name, :ios, '26.0')"; new="project.new_target(:application, project_name, :ios, '18.0')"
          if old not in s: raise SystemExit('generate_project.rb deployment target layout changed')
          s=s.replace(old,new,1); marker="  next if lib.include?('CMakeFiles')\n"
          if marker not in s: raise SystemExit('generate_project.rb library filter layout changed')
          s=s.replace(marker,marker+"  next if lib.include?('ffmpeg-')\n",1)
          anchor="app_target.frameworks_build_phase.add_file_reference(project.frameworks_group.new_file('System/Library/Frameworks/CoreHaptics.framework', :sdk_root), true)\n"
          additions=anchor+"app_target.frameworks_build_phase.add_file_reference(project.frameworks_group.new_file('System/Library/Frameworks/CoreMedia.framework', :sdk_root), true)\n"+"app_target.frameworks_build_phase.add_file_reference(project.frameworks_group.new_file('System/Library/Frameworks/CoreMotion.framework', :sdk_root), true)\n"
          if anchor not in s: raise SystemExit('generate_project.rb CoreHaptics framework anchor changed')
          p.write_text(s.replace(anchor,additions,1))
          PY
          echo "ENGINE_ROOT=$ENGINE_ROOT" >> "$GITHUB_ENV"

      - name: Audit iOS compatibility (diagnostic only)
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/audit-ios-port.sh" "$ENGINE_ROOT" || true

      - name: Build native ImGui font embed tool
        shell: bash
        run: |
          set -euxo pipefail
          SRC="$ENGINE_ROOT/externals/dear_imgui/misc/fonts/binary_to_compressed_c.cpp"; OUT="$RUNNER_TEMP/Dear_ImGui_FontEmbed"
          xcrun --sdk macosx clang++ -O2 -std=c++17 "$SRC" -o "$OUT"
          echo "IMGUI_FONT_EMBED_EXECUTABLE=$OUT" >> "$GITHUB_ENV"

      - name: Configure matching iOS engine
        shell: bash
        run: |
          set -euxo pipefail
          BUILD="$ENGINE_ROOT/runtime/build/shadps4-ios"; rm -rf "$BUILD"
          cmake -S "$ENGINE_ROOT" -B "$BUILD" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_SYSTEM_PROCESSOR=arm64 -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=18.0 -DENABLE_SHADPS4_IOS_LIB=ON -DENABLE_TESTS=OFF -DENABLE_UPDATER=OFF -DENABLE_DISCORD_RPC=OFF -DENABLE_SYSTEM_VULKAN=ON -DHWINFO_BATTERY=OFF -DHWINFO_DISK=OFF -DHWINFO_GPU=OFF -DHWINFO_MAINBOARD=OFF -DHWINFO_NETWORK=OFF -DIMGUI_FONT_EMBED_EXECUTABLE="$IMGUI_FONT_EMBED_EXECUTABLE" -DProtobuf_PROTOC_EXECUTABLE="$NATIVE_PROTOC" -DPROTOBUF_PROTOC_EXECUTABLE="$NATIVE_PROTOC"
          echo "ENGINE_BUILD=$BUILD" >> "$GITHUB_ENV"

      - name: Force native protoc for cross compile
        shell: bash
        run: |
          python3 - "$ENGINE_BUILD" "$NATIVE_PROTOC" <<'PY'
          import sys
          from pathlib import Path
          for p in Path(sys.argv[1]).rglob('*'):
              if not p.is_file(): continue
              try: s=p.read_text()
              except (UnicodeDecodeError,OSError): continue
              if 'protobuf::protoc' in s: p.write_text(s.replace('protobuf::protoc',sys.argv[2]))
          PY

      - name: Build matching shadps4_ios library
        run: cmake --build "$ENGINE_BUILD" --target shadps4_ios -- -v

      - name: Regenerate iOS project with matching libraries
        shell: bash
        run: |
          set -euxo pipefail
          cd "$ENGINE_ROOT"
          command -v xcodeproj >/dev/null 2>&1 || sudo gem install xcodeproj --no-document
          ruby generate_project.rb

      - name: Build unsigned MaxPS4 application
        shell: bash
        run: |
          set -euxo pipefail
          cd "$ENGINE_ROOT/AetherPS4-iOS"
          xcodebuild -project AetherPS4-iOS.xcodeproj -scheme AetherPS4-iOS -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/DerivedData" IPHONEOS_DEPLOYMENT_TARGET=18.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build

      - name: Validate emulator core and create IPA
        shell: bash
        run: |
          set -euxo pipefail
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          EXENAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist"); EXE="$APP/$EXENAME"
          nm "$EXE" 2>/dev/null | grep -E 'shadps4_(init|run|prepare_window)' | head -20
          test "$(stat -f%z "$EXE")" -ge 500000
          rm -rf "$RUNNER_TEMP/Payload"; mkdir -p "$RUNNER_TEMP/Payload"; cp -R "$APP" "$RUNNER_TEMP/Payload/MaxPS4.app"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName MaxPS4" "$RUNNER_TEMP/Payload/MaxPS4.app/Info.plist" || true
          cd "$RUNNER_TEMP"; zip -qr MaxPS4.ipa Payload; ls -lh MaxPS4.ipa

      - name: Upload MaxPS4 IPA
        uses: actions/upload-artifact@v4
        with:
          name: MaxPS4-redesign
          path: ${{ runner.temp }}/MaxPS4.ipa
          if-no-files-found: error
