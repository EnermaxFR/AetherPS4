name: Build MaxPS4 iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout MaxPS4
        uses: actions/checkout@v4

      - name: Prepare build tools
        shell: bash
        run: |
          set -euxo pipefail
          brew install ninja protobuf || true
          PROTOC="$(brew --prefix protobuf)/bin/protoc"
          test -x "$PROTOC"
          echo "NATIVE_PROTOC=$PROTOC" >> "$GITHUB_ENV"
          echo "$(dirname "$PROTOC")" >> "$GITHUB_PATH"

      - name: Restore and patch AetherPS4 iOS source tree
        shell: bash
        run: |
          set -euxo pipefail
          ENGINE_ROOT="$RUNNER_TEMP/aetherps4-ios-engine"
          git clone https://github.com/Leviidev/AetherPS4.git "$ENGINE_ROOT"
          git -C "$ENGINE_ROOT" checkout 74f94b61b213fbc231b59a3917cb404cbb25e098
          git -C "$ENGINE_ROOT" submodule update --init --recursive
          test -f "$ENGINE_ROOT/src/platform/ios/shadps4_ios_api.cpp"
          test -d "$ENGINE_ROOT/AetherPS4-iOS"
          grep -q 'ENABLE_SHADPS4_IOS_LIB' "$ENGINE_ROOT/CMakeLists.txt"
          grep -q 'add_library(shadps4_ios STATIC' "$ENGINE_ROOT/CMakeLists.txt"

          python3 - "$ENGINE_ROOT/externals/epoll-shim/src/CMakeLists.txt" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1]); s = p.read_text()
          start = s.index('include(CheckCSourceRuns)')
          probe_start = s.index('check_c_source_runs(', start)
          needle = 'ALLOWS_ONESHOT_TIMERS_WITH_TIMEOUT_ZERO)'
          probe_end = s.index(needle, probe_start) + len(needle)
          probe = s[probe_start:probe_end]
          replacement = 'if(CMAKE_SYSTEM_NAME STREQUAL "iOS")\n  set(ALLOWS_ONESHOT_TIMERS_WITH_TIMEOUT_ZERO FALSE CACHE BOOL "iOS cross-compile result" FORCE)\nelse()\n' + probe + '\nendif()'
          p.write_text(s[:probe_start] + replacement + s[probe_end:])
          PY

          python3 - "$ENGINE_ROOT" <<'PY'
          import sys
          from pathlib import Path
          root = Path(sys.argv[1]); patched = 0
          for p in root.rglob('ImGuiFileDialog.cpp'):
              s = p.read_text(errors='ignore')
              if 'std::system(' not in s: continue
              s = s.replace('std::system(', 'MaxPS4IOSSystemUnavailable(')
              helper = '\nstatic int MaxPS4IOSSystemUnavailable(const char*) { return -1; }\n'
              if 'static int MaxPS4IOSSystemUnavailable' not in s: s = helper + s
              p.write_text(s); patched += 1
          if not patched: raise SystemExit('ImGuiFileDialog.cpp std::system call not found')
          PY

          python3 - "$ENGINE_ROOT/src/core/signals.cpp" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1]); s = p.read_text()
          inc = '#include "core/ios/ios_jit_allocator.h"'
          guarded = '#ifdef SHADPS4_ENABLE_FEX_GUEST_CPU\n#include "common/singleton.h"'
          if guarded not in s: raise SystemExit('signals.cpp include layout changed; review required')
          if not s.startswith(inc + '\n'): s = inc + '\n' + s
          p.write_text(s)
          PY

          # The bundled FFmpeg prebuilt selected by APPLE is macOS, not iOS.
          # shadps4_ios already compiles src/platform/ios/ffmpeg_stub.cpp specifically
          # for this case, so keep the macOS FFmpeg archives out of the Xcode link.
          # SDL3's iOS camera/sensor backends also require CoreMedia and CoreMotion.
          python3 - "$ENGINE_ROOT/generate_project.rb" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1]); s = p.read_text()
          old_target = "project.new_target(:application, project_name, :ios, '26.0')"
          new_target = "project.new_target(:application, project_name, :ios, '18.0')"
          if old_target not in s: raise SystemExit('generate_project.rb deployment target layout changed')
          s = s.replace(old_target, new_target, 1)
          marker = "  next if lib.include?('CMakeFiles')\n"
          replacement = marker + "  next if lib.include?('ffmpeg-')\n"
          if marker not in s: raise SystemExit('generate_project.rb library filter layout changed')
          s = s.replace(marker, replacement, 1)

          framework_anchor = "  'CoreHaptics.framework',\n"
          framework_add = framework_anchor + "  'CoreMedia.framework',\n  'CoreMotion.framework',\n"
          if framework_anchor not in s: raise SystemExit('generate_project.rb framework list layout changed')
          s = s.replace(framework_anchor, framework_add, 1)
          p.write_text(s)
          PY

          echo "ENGINE_ROOT=$ENGINE_ROOT" >> "$GITHUB_ENV"

      - name: Audit iOS compatibility (diagnostic only)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          bash "$GITHUB_WORKSPACE/scripts/audit-ios-port.sh" "$ENGINE_ROOT"
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then echo "::warning::iOS compatibility audit exited with status $STATUS; build will continue."; fi
          exit 0

      - name: Build native ImGui font embed tool
        shell: bash
        run: |
          set -euxo pipefail
          SRC="$ENGINE_ROOT/externals/dear_imgui/misc/fonts/binary_to_compressed_c.cpp"
          test -f "$SRC"
          OUT="$RUNNER_TEMP/Dear_ImGui_FontEmbed"
          xcrun --sdk macosx clang++ -O2 -std=c++17 "$SRC" -o "$OUT"
          test -x "$OUT"
          echo "IMGUI_FONT_EMBED_EXECUTABLE=$OUT" >> "$GITHUB_ENV"

      - name: Configure matching iOS engine
        shell: bash
        run: |
          set -euxo pipefail
          BUILD="$ENGINE_ROOT/runtime/build/shadps4-ios"
          rm -rf "$BUILD"
          cmake -S "$ENGINE_ROOT" -B "$BUILD" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=18.0 \
            -DENABLE_SHADPS4_IOS_LIB=ON \
            -DENABLE_TESTS=OFF \
            -DENABLE_UPDATER=OFF \
            -DENABLE_DISCORD_RPC=OFF \
            -DENABLE_SYSTEM_VULKAN=ON \
            -DHWINFO_BATTERY=OFF -DHWINFO_DISK=OFF -DHWINFO_GPU=OFF -DHWINFO_MAINBOARD=OFF -DHWINFO_NETWORK=OFF \
            -DIMGUI_FONT_EMBED_EXECUTABLE="$IMGUI_FONT_EMBED_EXECUTABLE" \
            -DProtobuf_PROTOC_EXECUTABLE="$NATIVE_PROTOC" -DPROTOBUF_PROTOC_EXECUTABLE="$NATIVE_PROTOC"
          echo "ENGINE_BUILD=$BUILD" >> "$GITHUB_ENV"

      - name: Force native protoc for cross compile
        shell: bash
        run: |
          set -euxo pipefail
          python3 - "$ENGINE_BUILD" "$NATIVE_PROTOC" <<'PY'
          import sys
          from pathlib import Path
          root = Path(sys.argv[1]); protoc = sys.argv[2]; n = 0
          for p in root.rglob('*'):
              if not p.is_file(): continue
              try: s = p.read_text()
              except (UnicodeDecodeError, OSError): continue
              if 'protobuf::protoc' in s:
                  c = s.count('protobuf::protoc'); p.write_text(s.replace('protobuf::protoc', protoc)); n += c
          print('native protoc replacements:', n)
          PY
          ! grep -R -q 'protobuf::protoc' "$ENGINE_BUILD"

      - name: Build matching shadps4_ios library
        shell: bash
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/maxps4-engine.log"
          set +e
          cmake --build "$ENGINE_BUILD" --target shadps4_ios -- -v 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo '================ EXACT BUILD FAILURE ================'
            grep -n -E '(^|: )(error:|fatal error:)|FAILED:|ninja: build stopped|undefined symbol|Undefined symbols|command not found|protoc' "$LOG" | tail -160 || true
            tail -200 "$LOG" || true
            exit "$STATUS"
          fi
          LIB=$(find "$ENGINE_BUILD" -type f -name 'libshadps4_ios.a' -print -quit)
          test -n "$LIB"
          ls -lh "$LIB"

      - name: Regenerate iOS project with matching libraries
        shell: bash
        run: |
          set -euxo pipefail
          cd "$ENGINE_ROOT"
          if ! command -v xcodeproj >/dev/null 2>&1; then sudo gem install xcodeproj --no-document; fi
          ruby generate_project.rb
          test -d AetherPS4-iOS/AetherPS4-iOS.xcodeproj
          PROJECT=AetherPS4-iOS/AetherPS4-iOS.xcodeproj/project.pbxproj
          if grep -q 'ffmpeg-.*libav.*\.a' "$PROJECT"; then
            echo 'ERROR: macOS FFmpeg archive leaked into iOS Xcode project'
            exit 1
          fi
          grep -q 'CoreMedia.framework' "$PROJECT"
          grep -q 'CoreMotion.framework' "$PROJECT"

      - name: Build unsigned MaxPS4 application
        id: xcode_build
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          cd "$ENGINE_ROOT/AetherPS4-iOS"
          LOG="$RUNNER_TEMP/maxps4-xcodebuild.log"
          set +e
          xcodebuild -project AetherPS4-iOS.xcodeproj -scheme AetherPS4-iOS -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/DerivedData" IPHONEOS_DEPLOYMENT_TARGET=18.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          echo "$STATUS" > "$RUNNER_TEMP/maxps4-xcodebuild.status"
          if [ "$STATUS" -ne 0 ]; then
            echo '================ EXACT XCODE FAILURE ================'
            grep -n -E 'error:|fatal error:|Undefined symbols|ld: |clang: error:|SwiftCompile|CompileSwift|PhaseScriptExecution|BUILD FAILED' "$LOG" | tail -200 || true
            echo '================ LAST 250 LINES ====================='
            tail -250 "$LOG" || true
          fi
          exit "$STATUS"

      - name: Upload Xcode diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MaxPS4-xcode-diagnostics
          path: |
            ${{ runner.temp }}/maxps4-xcodebuild.log
            ${{ runner.temp }}/maxps4-xcodebuild.status
          if-no-files-found: warn
          retention-days: 14

      - name: Stop after Xcode failure
        if: steps.xcode_build.outcome == 'failure'
        shell: bash
        run: |
          echo 'Xcode build failed. Diagnostic artifact MaxPS4-xcode-diagnostics was preserved.'
          exit 1

      - name: Validate emulator core
        shell: bash
        run: |
          set -euxo pipefail
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          EXENAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          EXE="$APP/$EXENAME"
          file "$EXE"
          ls -lh "$EXE"
          nm "$EXE" 2>/dev/null | grep -E 'shadps4_(init|run|prepare_window)' | head -20
          SIZE=$(stat -f%z "$EXE")
          test "$SIZE" -ge 500000 || { echo "ERROR: emulator core is not linked ($SIZE bytes)"; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Create unsigned MaxPS4 IPA
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/MaxPS4.app"
          cd "$RUNNER_TEMP"
          zip -qr MaxPS4-with-emulator-unsigned.ipa Payload
          ls -lh MaxPS4-with-emulator-unsigned.ipa

      - name: Upload MaxPS4 IPA
        uses: actions/upload-artifact@v4
        with:
          name: MaxPS4-with-emulator
          path: ${{ runner.temp }}/MaxPS4-with-emulator-unsigned.ipa
          if-no-files-found: error
