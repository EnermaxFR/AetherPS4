name: Build AetherPS4 iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct AetherPS4 source
        shell: bash
        run: |
          set -euxo pipefail
          cat AetherPS4-source.zip.part-* > "$RUNNER_TEMP/AetherPS4-source.zip"
          mkdir -p extracted/source
          unzip -q "$RUNNER_TEMP/AetherPS4-source.zip" -d extracted/source

      - name: Select iOS project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=$(find extracted/source -name 'AetherPS4-iOS.xcodeproj' -print -quit)
          test -n "$PROJECT" || { echo 'ERROR: AetherPS4-iOS.xcodeproj not found'; exit 1; }
          APP_ROOT=$(dirname "$PROJECT")
          SOURCE_ROOT="$GITHUB_WORKSPACE/extracted/source"
          SCHEME=$(xcodebuild -project "$PROJECT" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["project"]["schemes"][0])')
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "APP_ROOT=$APP_ROOT" >> "$GITHUB_ENV"
          echo "SOURCE_ROOT=$SOURCE_ROOT" >> "$GITHUB_ENV"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

      - name: Prepare LLVM, Ninja and Protobuf toolchain
        shell: bash
        run: |
          set -euxo pipefail
          brew install llvm ninja protobuf || true
          LLVM_PREFIX=$(brew --prefix llvm)
          PROTOC=$(brew --prefix protobuf)/bin/protoc
          test -x "$LLVM_PREFIX/bin/llvm-config"
          test -x "$PROTOC"
          command -v ninja
          echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
          echo "$(dirname "$PROTOC")" >> "$GITHUB_PATH"
          echo "LLVM_CONFIG=$LLVM_PREFIX/bin/llvm-config" >> "$GITHUB_ENV"
          echo "NATIVE_PROTOC=$PROTOC" >> "$GITHUB_ENV"
          "$LLVM_PREFIX/bin/llvm-config" --version
          "$PROTOC" --version
          ninja --version

      - name: Restore real shadPS4 CMake project
        shell: bash
        run: |
          set -euxo pipefail
          ENGINE_ROOT="$RUNNER_TEMP/shadPS4-engine"
          git clone --depth 1 --recursive --shallow-submodules https://github.com/shadps4-emu/shadPS4.git "$ENGINE_ROOT"
          rsync -a "$SOURCE_ROOT/src/" "$ENGINE_ROOT/src/"
          test -f "$ENGINE_ROOT/CMakeLists.txt"
          grep -q 'cmake_minimum_required' "$ENGINE_ROOT/CMakeLists.txt"
          grep -q 'project(shadPS4' "$ENGINE_ROOT/CMakeLists.txt"
          test -f "$ENGINE_ROOT/src/platform/ios/shadps4_ios_api.cpp"
          test -f "$ENGINE_ROOT/src/platform/ios/shadps4_ios_api.h"
          echo "ENGINE_ROOT=$ENGINE_ROOT" >> "$GITHUB_ENV"

      - name: Patch ImGuiFileDialog for iOS
        shell: bash
        run: |
          set -euxo pipefail
          IFD_CPP=$(find "$ENGINE_ROOT" -type f -name 'ImGuiFileDialog.cpp' -print -quit)
          test -n "$IFD_CPP" || { echo 'ERROR: ImGuiFileDialog.cpp not found'; exit 1; }
          python3 - "$IFD_CPP" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          s = p.read_text()
          s = s.replace('std::system(', 'aether_ios_system(')
          marker = '#include'
          pos = s.find('\n', s.find(marker))
          shim = '''\n#if defined(__APPLE__)\n#include <TargetConditionals.h>\n#endif\n#if defined(__APPLE__) && TARGET_OS_IPHONE\nstatic inline int aether_ios_system(const char*) { return -1; }\n#else\nstatic inline int aether_ios_system(const char* command) { return std::system(command); }\n#endif\n'''
          s = s[:pos+1] + shim + s[pos+1:]
          p.write_text(s)
          PY

      - name: Patch macOS-only dependencies for iOS
        shell: bash
        run: |
          set -euxo pipefail
          python3 - "$ENGINE_ROOT" <<'PY'
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          hwinfo = list(root.rglob('hwinfo/src/apple'))
          disabled_hwinfo = []
          for d in hwinfo:
              if not d.is_dir(): continue
              for p in d.iterdir():
                  if not p.is_file() or p.suffix.lower() not in {'.c','.cc','.cpp','.cxx','.m','.mm'}: continue
                  try: s = p.read_text()
                  except (UnicodeDecodeError, OSError): continue
                  guard = '#include <TargetConditionals.h>\n#if !TARGET_OS_IPHONE\n'
                  if not s.startswith(guard): p.write_text(guard + s + '\n#endif\n')
                  disabled_hwinfo.append(str(p))
          print('Disabled hwinfo Apple backend files:')
          print('\n'.join(disabled_hwinfo) if disabled_hwinfo else '(none found)')
          unavailable = ('IOKit/IOCFBundle.h','IOKit/ps/IOPSKeys.h','IOKit/IOBSD.h','kIOMasterPortDefault')
          disabled = []
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.c','.cc','.cpp','.cxx','.m','.mm'}: continue
              try: s = p.read_text()
              except (UnicodeDecodeError, OSError): continue
              if not any(token in s for token in unavailable): continue
              guard = '#include <TargetConditionals.h>\n#if !TARGET_OS_IPHONE\n'
              if not s.startswith(guard): p.write_text(guard + s + '\n#endif\n')
              disabled.append(str(p))
          print('Other iOS-disabled Apple translation units:')
          print('\n'.join(disabled))
          PY

      - name: Build native ImGui font embed tool
        shell: bash
        run: |
          set -euxo pipefail
          FONT_EMBED_SRC=$(find "$ENGINE_ROOT/externals" -type f -path '*/misc/fonts/binary_to_compressed_c.cpp' -print -quit)
          test -n "$FONT_EMBED_SRC" || { echo 'ERROR: Dear ImGui binary_to_compressed_c.cpp not found'; exit 1; }
          FONT_EMBED_EXE="$RUNNER_TEMP/Dear_ImGui_FontEmbed"
          xcrun --sdk macosx clang++ -O2 -std=c++17 "$FONT_EMBED_SRC" -o "$FONT_EMBED_EXE"
          test -x "$FONT_EMBED_EXE"
          file "$FONT_EMBED_EXE"
          echo "IMGUI_FONT_EMBED_EXECUTABLE=$FONT_EMBED_EXE" >> "$GITHUB_ENV"

      - name: Add embeddable iOS engine target
        shell: bash
        run: |
          set -euxo pipefail
          cat >> "$ENGINE_ROOT/CMakeLists.txt" <<'CMAKE'

          if(CMAKE_SYSTEM_NAME STREQUAL "iOS")
            get_target_property(AETHER_SHAD_SOURCES shadps4 SOURCES)
            list(FILTER AETHER_SHAD_SOURCES EXCLUDE REGEX "(^|/)main\\.cpp$")
            list(APPEND AETHER_SHAD_SOURCES src/platform/ios/shadps4_ios_api.cpp)
            add_library(shadps4_ios STATIC ${AETHER_SHAD_SOURCES})
            get_target_property(AETHER_SHAD_LINK shadps4 LINK_LIBRARIES)
            if(AETHER_SHAD_LINK)
              target_link_libraries(shadps4_ios PRIVATE ${AETHER_SHAD_LINK})
            endif()
            get_target_property(AETHER_SHAD_INCLUDES shadps4 INCLUDE_DIRECTORIES)
            if(AETHER_SHAD_INCLUDES)
              target_include_directories(shadps4_ios PRIVATE ${AETHER_SHAD_INCLUDES})
            endif()
            get_target_property(AETHER_SHAD_DEFS shadps4 COMPILE_DEFINITIONS)
            if(AETHER_SHAD_DEFS)
              target_compile_definitions(shadps4_ios PRIVATE ${AETHER_SHAD_DEFS})
            endif()
            target_compile_definitions(shadps4_ios PRIVATE SHADPS4_LIBRARY_BUILD=1)
            target_include_directories(shadps4_ios PUBLIC ${CMAKE_CURRENT_SOURCE_DIR}/src/platform/ios)
          endif()
          CMAKE

      - name: Configure shadPS4 iOS engine
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S "$ENGINE_ROOT" -B "$RUNNER_TEMP/shadps4-ios" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=18.0 \
            -DKK_LLVM_CONFIG="$LLVM_CONFIG" \
            -DIMGUI_FONT_EMBED_EXECUTABLE="$IMGUI_FONT_EMBED_EXECUTABLE" \
            -DProtobuf_PROTOC_EXECUTABLE="$NATIVE_PROTOC" \
            -DPROTOBUF_PROTOC_EXECUTABLE="$NATIVE_PROTOC" \
            -DALLOWS_ONESHOT_TIMERS_WITH_TIMEOUT_ZERO_EXITCODE=1 \
            -DENABLE_TESTS=OFF \
            -DENABLE_UPDATER=OFF \
            -DENABLE_DISCORD_RPC=OFF \
            -DBUILD_SHARED_LIBS=OFF

      - name: Force native protoc in generated Ninja rules
        shell: bash
        run: |
          set -euxo pipefail
          test -x "$NATIVE_PROTOC"
          python3 - "$RUNNER_TEMP/shadps4-ios" "$NATIVE_PROTOC" <<'PY'
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          protoc = sys.argv[2]
          replacements = 0
          for p in root.rglob('*'):
              if not p.is_file():
                  continue
              try:
                  s = p.read_text()
              except (UnicodeDecodeError, OSError):
                  continue
              if 'protobuf::protoc' not in s:
                  continue
              new = s.replace('protobuf::protoc', protoc)
              if new != s:
                  p.write_text(new)
                  replacements += s.count('protobuf::protoc')
                  print(f'Patched protoc rule: {p}')
          print(f'Replaced {replacements} protobuf::protoc reference(s) with {protoc}')
          if replacements == 0:
              print('No literal protobuf::protoc remained; checking generated shadnet rule...')
          PY
          grep -R -n -E 'shadnet\.proto|shadnet\.pb\.cc' "$RUNNER_TEMP/shadps4-ios" | head -30 || true
          if grep -R -q 'protobuf::protoc' "$RUNNER_TEMP/shadps4-ios"; then
            echo 'ERROR: generated build still contains protobuf::protoc'
            exit 1
          fi

      - name: Build shadPS4 iOS engine
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build "$RUNNER_TEMP/shadps4-ios" --target shadps4_ios
          ENGINE_LIB=$(find "$RUNNER_TEMP/shadps4-ios" -type f -name 'libshadps4_ios.a' -print -quit)
          test -n "$ENGINE_LIB" || { echo 'ERROR: libshadps4_ios.a was not produced'; exit 1; }
          echo "ENGINE_LIB=$ENGINE_LIB" >> "$GITHUB_ENV"
          find "$RUNNER_TEMP/shadps4-ios" -type f -name '*.a' -print | sort

      - name: Patch Xcode absolute paths
        shell: bash
        run: |
          set -euxo pipefail
          PBXPROJ="$PROJECT/project.pbxproj"
          python3 - "$PBXPROJ" "$ENGINE_ROOT" "$RUNNER_TEMP/shadps4-ios" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          engine = sys.argv[2]
          build = sys.argv[3]
          text = p.read_text()
          old = "/Users/davi/Documents/Coding/AetherCore4/aetherps4-public-release"
          text = text.replace(old + "/build/shadps4-ios", build)
          text = text.replace(old, engine)
          p.write_text(text)
          PY

      - name: Build full iOS application
        shell: bash
        run: |
          set -euxo pipefail
          LIB_DIRS=$(find "$RUNNER_TEMP/shadps4-ios" -type f -name '*.a' -exec dirname {} \; | sort -u | tr '\n' ' ')
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            HEADER_SEARCH_PATHS="$ENGINE_ROOT/src/platform/ios $ENGINE_ROOT/src/core/pkg_extract $ENGINE_ROOT/src/core/sysmodules_import $ENGINE_ROOT/src/core/user_profile_bridge" \
            LIBRARY_SEARCH_PATHS="$LIB_DIRS" \
            FRAMEWORK_SEARCH_PATHS="$APP_ROOT/Frameworks" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Validate generated application
        shell: bash
        run: |
          set -euxo pipefail
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          EXENAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          EXE="$APP/$EXENAME"
          ls -lh "$EXE"
          file "$EXE"
          nm "$EXE" 2>/dev/null | grep -E 'shadps4_(init|run|prepare_window)' | head -20
          SIZE=$(stat -f%z "$EXE")
          test "$SIZE" -ge 500000 || { echo "ERROR: emulator core is not linked ($SIZE bytes)"; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qr AetherPS4-with-emulator-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AetherPS4-with-emulator
          path: ${{ runner.temp }}/AetherPS4-with-emulator-unsigned.ipa
          if-no-files-found: error
