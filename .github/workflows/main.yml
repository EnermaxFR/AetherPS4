name: Build AetherPS4 iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct full AetherPS4 source
        shell: bash
        run: |
          set -euxo pipefail
          cat AetherPS4-source.zip.part-* > "$RUNNER_TEMP/AetherPS4-source.zip"
          mkdir -p extracted/source
          unzip -q "$RUNNER_TEMP/AetherPS4-source.zip" -d extracted/source
          find extracted/source -name '*.xcodeproj' -o -name '*.xcworkspace'

      - name: Select iOS project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=$(find extracted/source -name 'AetherPS4-iOS.xcodeproj' -print -quit)
          test -n "$PROJECT" || { echo 'ERROR: AetherPS4-iOS.xcodeproj not found'; exit 1; }
          SCHEME=$(xcodebuild -project "$PROJECT" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["project"]["schemes"][0])')
          SOURCE_ROOT="$GITHUB_WORKSPACE/extracted/source"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "SOURCE_ROOT=$SOURCE_ROOT" >> "$GITHUB_ENV"

      - name: Restore shadPS4 dependencies
        shell: bash
        run: |
          set -euxo pipefail
          cd "$SOURCE_ROOT"
          clone_dep() {
            dir="$1"; repo="$2"; ref="${3:-}"
            if [ ! -d "$dir" ] || [ -z "$(ls -A "$dir" 2>/dev/null)" ]; then
              rm -rf "$dir"
              if [ -n "$ref" ]; then
                git clone --depth 1 --branch "$ref" "$repo" "$dir"
              else
                git clone --depth 1 "$repo" "$dir"
              fi
            fi
          }

          # The source archive does not contain its Git submodules. Restore the
          # dependencies required by its CMakeLists using the upstream repos.
          rm -rf ext-boost
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/shadps4-emu/ext-boost.git ext-boost
          git -C ext-boost submodule update --init --recursive --depth 1

          clone_dep spdlog https://github.com/gabime/spdlog.git v2.x
          clone_dep fmt https://github.com/shadps4-emu/ext-fmt.git
          clone_dep zlib-ng https://github.com/shadps4-emu/ext-zlib-ng.git
          clone_dep ffmpeg-core https://github.com/shadps4-emu/ext-ffmpeg-core.git
          clone_dep freetype https://github.com/freetype/freetype.git
          clone_dep sdl3 https://github.com/shadexternals/sdl3.git main
          clone_dep vulkan-headers https://github.com/KhronosGroup/Vulkan-Headers.git
          clone_dep vma https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator.git
          clone_dep glslang https://github.com/KhronosGroup/glslang.git
          clone_dep robin-map https://github.com/Tessil/robin-map.git
          clone_dep xbyak https://github.com/herumi/xbyak.git
          clone_dep magic_enum https://github.com/Neargye/magic_enum.git
          clone_dep toml11 https://github.com/ToruNiina/toml11.git
          clone_dep zydis https://github.com/zyantific/zydis.git
          clone_dep sirit https://github.com/shadps4-emu/sirit.git
          clone_dep libpng https://github.com/pnggroup/libpng.git
          clone_dep tracy https://github.com/shadps4-emu/tracy.git
          clone_dep pugixml https://github.com/zeux/pugixml.git
          clone_dep hwinfo https://github.com/shadps4-emu/ext-hwinfo.git
          clone_dep date https://github.com/HowardHinnant/date.git
          clone_dep epoll-shim https://github.com/jiixyj/epoll-shim.git
          clone_dep json https://github.com/nlohmann/json.git
          clone_dep miniz https://github.com/richgel999/miniz.git
          clone_dep CLI11 https://github.com/shadexternals/CLI11.git
          clone_dep openal-soft https://github.com/shadexternals/openal-soft.git
          clone_dep libressl https://github.com/shadexternals/libressl.git
          clone_dep miniupnp https://github.com/miniupnp/miniupnp.git

          # This source tree expects these two dependency directories by these names.
          clone_dep gcn https://github.com/shadps4-emu/ext-gnm.git || true
          mkdir -p aacdec
          if [ ! -d aacdec/fdk-aac ] || [ -z "$(ls -A aacdec/fdk-aac 2>/dev/null)" ]; then
            rm -rf aacdec/fdk-aac
            git clone --depth 1 https://android.googlesource.com/platform/external/aac aacdec/fdk-aac
          fi

          for d in ext-boost spdlog fmt zlib-ng ffmpeg-core freetype sdl3 vulkan-headers vma glslang robin-map xbyak magic_enum toml11 zydis sirit libpng tracy pugixml hwinfo date epoll-shim json miniz CLI11 openal-soft libressl miniupnp aacdec/fdk-aac; do
            test -d "$d" && test -n "$(ls -A "$d")" || { echo "ERROR: missing dependency $d"; exit 1; }
          done

      - name: Configure shadPS4 iOS engine
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S "$SOURCE_ROOT" -B "$RUNNER_TEMP/shadps4-ios" \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.4 \
            -DARCHITECTURE=arm64 \
            -DSHADPS4_LIBRARY_BUILD=ON \
            -DBUILD_SHARED_LIBS=OFF

      - name: Build shadPS4 iOS engine and dependencies
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build "$RUNNER_TEMP/shadps4-ios" --config Release --target shadps4_ios
          find "$RUNNER_TEMP/shadps4-ios" -type f \( -name '*.a' -o -name '*.framework' \) -print | sort

      - name: Build full iOS application
        shell: bash
        run: |
          set -euxo pipefail
          LIB_DIRS=$(find "$RUNNER_TEMP/shadps4-ios" -type f -name '*.a' -exec dirname {} \; | sort -u | tr '\n' ' ')
          test -n "$LIB_DIRS" || { echo 'ERROR: no emulator libraries were built'; exit 1; }
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            HEADER_SEARCH_PATHS="$SOURCE_ROOT/src/platform/ios $SOURCE_ROOT/src/core/pkg_extract $SOURCE_ROOT/src/core/sysmodules_import $SOURCE_ROOT/src/core/user_profile_bridge" \
            LIBRARY_SEARCH_PATHS="$LIB_DIRS" \
            FRAMEWORK_SEARCH_PATHS="$SOURCE_ROOT/AetherPS4-iOS/Frameworks" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Validate generated application
        shell: bash
        run: |
          set -euxo pipefail
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          EXENAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          EXE="$APP/$EXENAME"
          ls -lh "$EXE"
          file "$EXE"
          nm "$EXE" 2>/dev/null | grep -E 'shadps4_(init|run|prepare_window)' | head -20
          SIZE=$(stat -f%z "$EXE")
          test "$SIZE" -ge 500000 || { echo "ERROR: emulator core is not linked ($SIZE bytes)"; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qr AetherPS4-with-emulator-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AetherPS4-with-emulator
          path: ${{ runner.temp }}/AetherPS4-with-emulator-unsigned.ipa
          if-no-files-found: error
