name: Build AetherPS4 iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild source archive
        shell: bash
        run: |
          set -euxo pipefail
          cat AetherPS4-source.zip.part-* > AetherPS4-source.zip
          unzip -q AetherPS4-source.zip -d source
          echo "Archive reconstructed."
          find source -maxdepth 3 -type f | head -100

      - name: Find Xcode project
        id: project
        shell: bash
        run: |
          set -euxo pipefail

          WORKSPACE="$(find source -name '*.xcworkspace' -not -path '*/Pods/*' | head -1 || true)"
          PROJECT="$(find source -name '*.xcodeproj' | head -1 || true)"

          if [ -n "$WORKSPACE" ]; then
            echo "kind=workspace" >> "$GITHUB_OUTPUT"
            echo "path=$WORKSPACE" >> "$GITHUB_OUTPUT"
            SCHEME="$(xcodebuild -workspace "$WORKSPACE" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["workspace"]["schemes"][0])')"
          elif [ -n "$PROJECT" ]; then
            echo "kind=project" >> "$GITHUB_OUTPUT"
            echo "path=$PROJECT" >> "$GITHUB_OUTPUT"
            SCHEME="$(xcodebuild -project "$PROJECT" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["project"]["schemes"][0])')"
          else
            echo "::error::Aucun fichier .xcodeproj ou .xcworkspace trouvé dans l'archive."
            exit 1
          fi

          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Scheme: $SCHEME"

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -euxo pipefail

          KIND="${{ steps.project.outputs.kind }}"
          PATH_XCODE="${{ steps.project.outputs.path }}"
          SCHEME="${{ steps.project.outputs.scheme }}"

          if [ "$KIND" = "workspace" ]; then
            TARGET_ARG=(-workspace "$PATH_XCODE")
          else
            TARGET_ARG=(-project "$PATH_XCODE")
          fi

          xcodebuild \
            "${TARGET_ARG[@]}" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        shell: bash
        run: |
          set -euxo pipefail

          APP="$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1 || true)"
          if [ -z "$APP" ]; then
            echo "::error::Aucun .app iOS produit."
            exit 1
          fi

          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry AetherPS4.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherPS4-iOS
          path: AetherPS4.ipa
          if-no-files-found: error
